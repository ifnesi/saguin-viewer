# The dashboard used when no file is named, so the tool is useful with none.
#
# **It asks for numbers only some brokers have.** Queue metrics need a queue
# channel, bridge metrics need a bridge, and a refusal counter does not exist
# until something has been refused for a reason, and a rate over a series that
# does not exist is nothing: nothing has gone wrong. A dashboard file you write is
# refused when it names a metric this broker does not serve, because you named
# it; this one says at the foot of the screen which of its metrics were absent,
# and draws the rest.
#
# **One screen, not the catalogue.** Every metric Sagüin serves is drawn by the
# web viewer; this default is what fits an eighty-column terminal and answers
# "is it up, is anything behind, is anything lost, is anything refused". Left
# to the web viewer, or to a dashboard file of your own: traffic volumes (bytes,
# publishes received, deliveries sent, connections opened), Wills, restored
# sessions, the exactly-once counts, a session's queue, provider bytes and
# commit statistics, retention and superseded counts, the queue lifecycle
# counters beside depth, in flight and dead-lettered, and the per-protocol
# connection split, and the Go runtime's ten series: they are rates, and this
# tool draws one scrape. What is lost is here in full: an operator reading one
# screen must not miss a record the broker let go.
refresh: 60s

groups:
  # Uptime first, because the question after "is it up" is "since when", and a
  # broker whose uptime is minutes is one that restarted.
  - title: Broker
    layout: columns
    metrics:
      - saguin_uptime_seconds
      - saguin_connections_open
      - saguin_sessions_away
      - saguin_subscriptions
      - saguin_retained_values

  # **The one alert worth a column is the last one here.** A floor above the
  # lowest position a consumer holds means retention has passed that consumer,
  # so the records between are gone before it reads them. Its warning shot is
  # the column before it, next minus that position.
  #
  # **Both are computed here because no metric can carry either:** a threshold
  # nobody can choose on an operator's behalf, or a series per consumer. So the
  # broker publishes the operands and a dashboard does the arithmetic.
  #
  # Both are `-` until something consumes durably, because
  # saguin_channel_position_min has no series until then and an unknown operand
  # makes the cell unknown rather than zero. saguin_channel_consumers is the
  # denominator that separates one straggler from a fleet that has stopped.
  - title: Channels
    layout: rows
    by: channel
    metrics:
      - saguin_channel_records
      - saguin_channel_bytes
      - saguin_channel_next_offset
      - saguin_channel_consumers
      - name: behind
        value: saguin_channel_next_offset - saguin_channel_position_min
      - name: data lost
        value: saguin_channel_floor_offset > saguin_channel_position_min

  # Workers holding a worker subscription, jobs offered and acknowledged, and
  # jobs dead-lettered: work that ran out of time, attempts or room and sits on
  # the __dlq channel waiting for somebody to look at it.
  - title: Queues
    layout: rows
    by: channel
    metrics:
      - saguin_queue_workers
      - saguin_queue_delivered_total
      - saguin_queue_acknowledged_total
      - saguin_queue_dead_lettered_total

  # A bridge that is down is the thing an operator most wants a number for, and
  # reconnects say whether it keeps coming back.
  - title: Bridges
    layout: rows
    by: bridge
    metrics:
      - saguin_bridge_connected
      - saguin_bridge_reconnects_total
      - saguin_bridge_received_total
      - saguin_bridge_sent_total

  # **Different failures, and they are not interchangeable.** An expired
  # delivery waited past its Message Expiry; an abandoned exactly-once publish
  # was taken in and never released; a Will cancelled never had to be sent.
  - title: Expired and abandoned
    layout: columns
    metrics:
      - saguin_deliveries_expired_total
      - saguin_qos2_abandoned_total
      - saguin_wills_cancelled_total

  # **What the broker let go, by why.** A consumer's records it never received,
  # a Will that could not be published, and a bridge's records not sent to its
  # peer - each counts something that will not arrive, and the cause says
  # which knob or failure to look at. A row per cause across the three; a cause
  # one of them does not have is blank in its column.
  - title: Lost, by cause
    layout: rows
    by: cause
    metrics:
      - saguin_missed_total
      - saguin_wills_dropped_total
      - saguin_bridge_unsent_total

  # The store: its size, its log's, whether a full disk has refused a write,
  # and how long publishers have waited for the writer. A store error other
  # than a full disk stops the broker, so it has no counter.
  - title: Store
    layout: columns
    metrics:
      - saguin_store_bytes
      - saguin_store_wal_bytes
      - saguin_store_full
      - saguin_store_no_credit_seconds_total
