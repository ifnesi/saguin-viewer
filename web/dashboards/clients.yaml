# Clients: the series metrics.md lists under "Connections and sessions", each drawn once.
# A card's description is the broker's own HELP line for its series.
title: "Clients"
grid:
  columns: 12

cards:
  - type: text
    markdown: |
      # Connections and sessions
      Connections, refusals and disconnects, the sessions kept while their clients are away, subscriptions and Wills.

  - { type: break }
  - { type: stat, width: 3, title: "Connections open", metric: saguin_connections_open }
  - { type: stat, width: 3, title: "Connections accepted", metric: saguin_connections_accepted_total }
  - { type: stat, width: 3, title: "Sessions away", metric: saguin_sessions_away }
  - { type: stat, width: 3, title: "Sessions restored", metric: saguin_sessions_restored_total }
  - { type: break }
  - { type: stat, width: 3, title: "Session expiry capped", metric: saguin_session_expiry_capped_total }
  - { type: stat, width: 3, title: "Subscriptions held", metric: saguin_subscriptions_held }
  - { type: stat, width: 3, title: "Wills cancelled", metric: saguin_wills_cancelled_total }
  - { type: break }
  - { type: breakdown, width: 6, height: medium, title: "Connections",
      metric: saguin_connections, by: protocol }
  - { type: breakdown, width: 6, height: medium, title: "Connections refused",
      metric: saguin_connections_refused_total, by: reason, severity: warning }
  - { type: break }
  - { type: breakdown, width: 6, height: medium, title: "Disconnects",
      metric: saguin_disconnects_total, by: reason }
  - { type: breakdown, width: 6, height: medium, title: "Sessions ended",
      metric: saguin_sessions_ended_total, by: cause }
  - { type: break }
  - { type: timeseries, width: 6, height: medium, title: "Subscriptions",
      metric: saguin_subscriptions, mode: level }
  - { type: breakdown, width: 6, height: medium, title: "Subscriptions refused",
      metric: saguin_subscriptions_refused_total, by: reason, severity: warning }
  - { type: break }
  - { type: timeseries, width: 6, height: medium, title: "Wills waiting",
      metric: saguin_wills_waiting, mode: level }
  - { type: breakdown, width: 6, height: medium, title: "Wills published",
      metric: saguin_wills_published_total, by: cause }
  - { type: break }
  - { type: breakdown, width: 6, height: medium, title: "Wills dropped",
      metric: saguin_wills_dropped_total, by: cause, severity: warning }
