# Queues: the series metrics.md lists under "Queues", each drawn once.
# A card's description is the broker's own HELP line for its series.
title: "Queues"
grid:
  columns: 12

cards:
  - type: text
    markdown: |
      # Queues
      Jobs by state, workers, offers and acknowledgements, failed attempts, stale responses and dead letters.

  - { type: break }
  - { type: breakdown, width: 6, height: medium, title: "Queue jobs",
      metric: saguin_queue_jobs, by: state }
  - { type: breakdown, width: 6, height: medium, title: "Queue workers",
      metric: saguin_queue_workers, by: channel }
  - { type: break }
  - { type: breakdown, width: 6, height: medium, title: "Queue delivered",
      metric: saguin_queue_delivered_total, by: channel }
  - { type: breakdown, width: 6, height: medium, title: "Queue acknowledged",
      metric: saguin_queue_acknowledged_total, by: channel }
  - { type: break }
  - { type: breakdown, width: 6, height: medium, title: "Queue attempts failed",
      metric: saguin_queue_attempts_failed_total, by: channel, severity: warning }
  - { type: breakdown, width: 6, height: medium, title: "Queue stale responses",
      metric: saguin_queue_stale_responses_total, by: channel }
  - { type: break }
  - { type: breakdown, width: 6, height: medium, title: "Queue dead lettered",
      metric: saguin_queue_dead_lettered_total, by: channel, severity: warning }
