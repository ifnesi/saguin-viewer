# Runtime: the series metrics.md lists under "Go runtime", each drawn once.
# A card's description is the broker's own HELP line for its series.
title: "Runtime"
grid:
  columns: 12

cards:
  - type: text
    markdown: |
      # Go runtime
      The Go runtime's heap, collections, allocations, stacks and settings.

  - { type: break }
  - { type: timeseries, width: 12, height: medium, title: "Go gc cycles, a second",
      metric: saguin_go_gc_cycles_total, mode: rate, format: msgs_rate }

  - { type: break }
  - { type: stat, width: 3, title: "Go heap live bytes", metric: saguin_go_heap_live_bytes, format: bytes }
  - { type: stat, width: 3, title: "Go heap goal bytes", metric: saguin_go_heap_goal_bytes, format: bytes }
  - { type: stat, width: 3, title: "Go gogc percent", metric: saguin_go_gogc_percent }
  - { type: stat, width: 3, title: "Go memory limit bytes", metric: saguin_go_memory_limit_bytes, format: bytes_or_none }
  - { type: break }
  - { type: timeseries, width: 6, height: medium, title: "Go gc cpu seconds, a second",
      metric: saguin_go_gc_cpu_seconds_total, mode: rate, format: msgs_rate }
  - { type: break }
  - { type: timeseries, width: 6, height: medium, title: "Go gc assist cpu seconds, a second",
      metric: saguin_go_gc_assist_cpu_seconds_total, mode: rate, format: msgs_rate }
  - { type: timeseries, width: 6, height: medium, title: "Go stack bytes",
      metric: saguin_go_stack_bytes, mode: level, format: bytes }
  - { type: break }
  - { type: timeseries, width: 6, height: medium, title: "Go allocated bytes, a second",
      metric: saguin_go_allocated_bytes_total, mode: rate, format: bytes_rate }
  - { type: timeseries, width: 6, height: medium, title: "Go allocated objects, a second",
      metric: saguin_go_allocated_objects_total, mode: rate, format: msgs_rate }
